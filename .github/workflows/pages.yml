name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Test response channel
        if: contains(github.event.head_commit.message, 'Teste canal de resposta')
        run: |
          curl --fail --silent --show-error \
            --data "✅ Canal de respostas configurado. Quando a Melissa confirmar o date, a resposta vai aparecer aqui." \
            "https://ntfy.sh/date_NfD6Sq8sOv0jjNZ9UTGZEKasw83leepEahTS"
