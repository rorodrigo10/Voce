<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6268f1" />
  <title>Melissa 💙🩷</title>
  <style>
    :root{
      --bg1:#55b7ff;
      --bg2:#6d63f2;
      --bg3:#ff62b7;
      --text:#fffaff;
      --muted:#efeaff;
      --pink:#ff65b8;
      --blue:#75c9ff;
      --shadow:rgba(27,23,88,.28);
    }
    *{box-sizing:border-box}
    html{min-height:100%;margin:0;background:#6d63f2}
    body{
      min-height:100%;
      margin:0;
      font-family:Inter,ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,-apple-system,sans-serif;
      color:var(--text);
      overflow-x:hidden;
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      background:
        radial-gradient(circle at 15% 10%,rgba(255,255,255,.20),transparent 22%),
        radial-gradient(circle at 86% 14%,rgba(255,182,235,.24),transparent 22%),
        radial-gradient(circle at 78% 86%,rgba(129,211,255,.22),transparent 25%),
        linear-gradient(155deg,var(--bg1),var(--bg2) 50%,var(--bg3));
    }
    button,input{font:inherit}
    button{cursor:pointer}
    .app{
      position:relative;
      width:100%;
      min-height:100vh;
      min-height:100svh;
      min-height:100dvh;
      display:grid;
      place-items:center;
      padding:
        max(18px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(22px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      isolation:isolate;
    }
    .heart-field{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
    .heart{
      position:absolute;width:var(--s);height:var(--s);transform:rotate(-45deg);
      background:linear-gradient(135deg,#24458f,#7739b1 60%,#ff6ec2);
      border-radius:4px;opacity:.85;filter:drop-shadow(0 8px 8px rgba(0,0,0,.16));
      animation:floatUp var(--d) linear infinite;animation-delay:var(--delay);
    }
    .heart:before,.heart:after{content:"";position:absolute;width:100%;height:100%;background:inherit;border-radius:50%}
    .heart:before{top:-50%;left:0}.heart:after{left:50%;top:0}
    @keyframes floatUp{
      0%{transform:translate3d(0,18vh,0) rotate(-45deg) scale(.8);opacity:0}
      12%{opacity:.88}
      55%{transform:translate3d(var(--drift),-45vh,0) rotate(-25deg) scale(1.05)}
      100%{transform:translate3d(calc(var(--drift)*-.35),-120vh,0) rotate(-60deg) scale(.82);opacity:0}
    }
    .shell{width:min(100%,420px);min-width:0;position:relative;margin:auto}
    .progress{display:flex;gap:7px;justify-content:center;margin:0 0 18px}
    .dot{width:7px;height:7px;border-radius:999px;background:rgba(255,255,255,.30);transition:.25s}
    .dot.active{width:24px;background:white}
    .card{
      background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.08));
      border:1px solid rgba(255,255,255,.26);border-radius:28px;padding:27px 22px 22px;max-width:100%;
      box-shadow:0 24px 60px var(--shadow),inset 0 1px 0 rgba(255,255,255,.34),inset 0 -1px 0 rgba(255,255,255,.08);
      backdrop-filter:blur(28px) saturate(175%);-webkit-backdrop-filter:blur(28px) saturate(175%);
      min-height:310px;display:flex;flex-direction:column;justify-content:center;
      animation:cardIn .32s ease both;position:relative;overflow:hidden;
    }
    .card:before{content:"";position:absolute;inset:-1px -1px auto -1px;height:46%;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,.10) 48%,transparent);border-radius:28px 28px 50% 50%/28px 28px 22px 22px}
    @keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
    .emoji{font-size:74px;line-height:1;text-align:center;margin-bottom:12px;filter:drop-shadow(0 12px 18px rgba(0,0,0,.17));position:relative;z-index:1}
    h1{font-size:clamp(21px,6.4vw,25px);line-height:1.1;text-align:center;margin:0 0 9px;font-weight:950;letter-spacing:.2px;position:relative;z-index:1;text-transform:uppercase;overflow-wrap:anywhere}
    .sub{text-align:center;color:var(--muted);font-size:14px;line-height:1.45;margin:0 auto 18px;max-width:315px;position:relative;z-index:1}
    .btn{
      border:1px solid rgba(255,255,255,.24);border-radius:16px;padding:14px 16px;font-weight:900;
      color:#fff;background:linear-gradient(135deg,rgba(113,198,255,.94),rgba(255,99,183,.90));
      box-shadow:0 10px 24px rgba(71,77,213,.20),inset 0 1px 0 rgba(255,255,255,.35);
      transition:transform .16s ease,filter .16s ease,box-shadow .16s ease;width:100%;min-height:48px;
      backdrop-filter:blur(18px) saturate(145%);-webkit-backdrop-filter:blur(18px) saturate(145%);
      position:relative;overflow:hidden;
    }
    .btn:hover{transform:translateY(-2px) scale(1.015);filter:brightness(1.05)}
    .btn:active{transform:scale(.98)}
    .btn.secondary{background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.08));box-shadow:0 10px 22px rgba(34,30,96,.12),inset 0 1px 0 rgba(255,255,255,.28);text-transform:none}
    .yes-no{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;margin-top:4px;position:relative;z-index:2}
    .yes-no .btn{margin:0}
    .no-btn{z-index:30;touch-action:manipulation;user-select:none;-webkit-user-select:none;white-space:nowrap}
    .no-btn.runaway{position:fixed;width:auto;min-width:112px;margin:0;z-index:50;will-change:left,top,transform;box-shadow:0 14px 30px rgba(36,30,104,.22),inset 0 1px 0 rgba(255,255,255,.22);transition:left .52s cubic-bezier(.22,.9,.25,1),top .52s cubic-bezier(.22,.9,.25,1),transform .28s ease}
    .fields{display:grid;gap:12px;margin:8px 0 18px;position:relative;z-index:2}
    label{font-size:12px;color:var(--muted);font-weight:750;display:grid;gap:6px}
    input{display:block;width:100%;min-width:0;max-width:100%;font-size:16px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.11);color:white;border-radius:14px;padding:13px 14px;outline:none;color-scheme:dark;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
    input:focus{border-color:rgba(150,215,255,.95);box-shadow:0 0 0 3px rgba(119,174,255,.16)}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0 18px;position:relative;z-index:2}
    .choice{
      min-height:82px;border:1px solid rgba(255,255,255,.19);border-radius:16px;background:rgba(255,255,255,.10);color:#fff;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:11px;font-weight:850;
      transition:transform .18s ease,background .18s ease,border-color .18s ease,box-shadow .18s ease,filter .18s ease;
      backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
      box-shadow:inset 0 1px 0 rgba(255,255,255,.17);position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;
    }
    .choice:hover{transform:translateY(-3px) scale(1.05);background:rgba(44,39,105,.33);border-color:rgba(255,255,255,.37);box-shadow:0 12px 24px rgba(26,27,87,.20),inset 0 1px 0 rgba(255,255,255,.22);filter:brightness(1.07);z-index:3}
    .choice:active{transform:scale(.97)}
    .choice .ic{font-size:25px}
    .choice.selected{transform:scale(1.055);background:linear-gradient(145deg,rgba(76,108,255,.68),rgba(255,83,178,.60));border-color:rgba(238,241,255,.90);box-shadow:0 14px 30px rgba(36,30,104,.28),0 0 0 2px rgba(255,255,255,.16),inset 0 1px 0 rgba(255,255,255,.29);filter:brightness(1.08);z-index:4}
    .choice.selected:after{content:"✓";position:absolute;right:8px;top:7px;width:20px;height:20px;border-radius:999px;display:grid;place-items:center;font-size:12px;font-weight:1000;color:#6255d8;background:rgba(255,255,255,.95);box-shadow:0 4px 12px rgba(0,0,0,.15)}
    .summary{background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.19);border-radius:18px;padding:13px 14px;margin:8px 0 16px;position:relative;z-index:2;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
    .row{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.09);font-size:13px}
    .row:last-child{border:0}.row span{color:var(--muted)}.row strong{text-align:right}
    .signature{text-align:center;color:rgba(255,255,255,.72);font-size:11px;margin-top:14px}
    .toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);width:max-content;max-width:calc(100vw - 32px);background:rgba(255,255,255,.16);color:white;border:1px solid rgba(255,255,255,.22);padding:10px 14px;border-radius:999px;font-size:12px;line-height:1.35;text-align:center;opacity:0;pointer-events:none;transition:.25s;white-space:normal;z-index:80;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .final-card{text-align:center}
    .final-card h1{font-size:28px}
    .celebration-gif{
      display:block;
      border:0;
      width:min(100%,310px);
      aspect-ratio:498/407;
      object-fit:cover;
      margin:4px auto 18px;
      border-radius:20px;
      border:1px solid rgba(255,255,255,.30);
      box-shadow:0 18px 38px rgba(25,22,82,.28),inset 0 1px 0 rgba(255,255,255,.28);
      position:relative;
      z-index:2;
    }
    .celebration-badge{
      display:inline-flex;
      align-items:center;
      gap:7px;
      margin:0 auto 12px;
      padding:7px 11px;
      border-radius:999px;
      background:rgba(255,255,255,.13);
      border:1px solid rgba(255,255,255,.20);
      font-size:11px;
      font-weight:900;
      position:relative;
      z-index:2;
    }
    @media (hover:none){.choice:hover{transform:none;background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.19);box-shadow:inset 0 1px 0 rgba(255,255,255,.17);filter:none}.choice.selected{transform:scale(1.035);background:linear-gradient(145deg,rgba(76,108,255,.68),rgba(255,83,178,.60));border-color:rgba(238,241,255,.90);box-shadow:0 12px 26px rgba(36,30,104,.24),0 0 0 2px rgba(255,255,255,.14),inset 0 1px 0 rgba(255,255,255,.26);filter:brightness(1.08)}}
    @media (max-width:480px){
      .app{place-items:start center;padding-top:max(16px,env(safe-area-inset-top));}
      .shell{width:100%;padding-top:4px}
      .progress{margin-bottom:12px}
      .card{min-height:0;border-radius:24px;padding:22px 16px 18px}
      .card:before{border-radius:24px 24px 50% 50%/24px 24px 20px 20px}
      .emoji{font-size:60px;margin-bottom:10px}
      .sub{font-size:13.5px;margin-bottom:16px}
      .yes-no{gap:8px}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:9px 0 16px}
      .choice{min-height:76px;font-size:12px}
      .choice .ic{font-size:24px}
      .summary{padding:11px 12px}
      .row{gap:10px;font-size:12.5px}
      .signature{margin-top:11px;padding-bottom:4px}
      .no-btn.runaway{min-width:105px}
    }
    @media (max-width:350px){
      .app{padding-left:12px;padding-right:12px}
      .card{padding-left:14px;padding-right:14px}
      .btn{padding-left:10px;padding-right:10px;font-size:13px}
      .yes-no{gap:7px}
      .grid{gap:7px}
      .choice{min-height:72px}
    }
    @media (max-height:690px) and (min-width:481px){.card{min-height:280px;padding-top:20px}.emoji{font-size:60px}.choice{min-height:70px}.grid{gap:7px}}
    @media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
<main class="app">
  <div class="heart-field" id="heartField"></div>
  <section class="shell">
    <div class="progress" id="progress"></div>
    <div id="screen"></div>
    <div class="signature">feito especialmente para Melissa Garcia 💙🩷</div>
  </section>
  <div class="toast" id="toast"></div>
</main>
<script>
  const CONFIG={
    nomeDela:"Melissa",
    youtubeUrl:"https://www.youtube.com/watch?v=W7nmB20qJv4",
    celebrationEmbed:"https://tenor.com/embed/16796139",
    ntfyTopic:"date_NfD6Sq8sOv0jjNZ9UTGZEKasw83leepEahTS",
    formspree:"" // opcional
  };

  const state={step:0,date:"",time:"",food:"",vibe:"",noAttempts:0};
  const foods=[["🍔","Hambúrguer"],["🍣","Sushi"],["🍝","Massas"],["🌮","Tacos"],["🍕","Pizza"],["☕","Café"]];
  const vibes=[["🍿","Cinema"],["💿","Loja de discos"],["🎤","Stand-up comedy"],["🍻","Barzinho + música ao vivo"],["💦","Cachoeira"],["🎁","Surpresa"]];
  const totalSteps=5;
  const screen=document.getElementById('screen');
  const progress=document.getElementById('progress');

  function renderProgress(){
    if(state.step>4){progress.innerHTML='';return;}
    progress.innerHTML=Array.from({length:totalSteps},(_,i)=>`<span class="dot ${i===state.step?'active':''}"></span>`).join('');
  }

  function render(){
    const oldNo=document.getElementById('noBtn');
    if(oldNo && !screen.contains(oldNo)) oldNo.remove();
    renderProgress();

    if(state.step===0){
      screen.innerHTML=`<div class="card">
        <div class="emoji">🙂</div>
        <h1>Melissa, quero te convidar pra sair.</h1>
        <p class="sub">topa um date comigo? 👀</p>
        <div class="yes-no">
          <button class="btn" onclick="yes()">SIM 💙</button>
          <button id="noBtn" class="btn secondary no-btn" onclick="runAway(event)">NÃO 😶</button>
        </div>
      </div>`;
    }

    if(state.step===1){
      screen.innerHTML=`<div class="card">
        <div class="emoji">🥹</div>
        <h1>VOCÊ DISSE SIM?</h1>
        <p class="sub">eu tava esperando você clicar no não só pra testar o botão kkkkk</p>
        <button class="btn" onclick="next()">PRÓXIMO 💙</button>
      </div>`;
    }

    if(state.step===2){
      screen.innerHTML=`<div class="card">
        <h1>📅 QUANDO VOCÊ TÁ LIVRE?</h1>
        <p class="sub">escolhe um dia e um horário 👀</p>
        <div class="fields">
          <label>Escolha a data<input id="date" type="date" value="${state.date}"></label>
          <label>Escolha o horário<input id="time" type="time" value="${state.time||'19:00'}"></label>
        </div>
        <button class="btn" onclick="saveDate()">SELECIONAR A DATA 💙</button>
      </div>`;
      setMinDate();
    }

    if(state.step===3){
      screen.innerHTML=`<div class="card">
        <h1>O QUE TÁ AFIM? 😋</h1>
        <p class="sub">escolhe primeiro 👇</p>
        <div class="grid">${foods.map(([ic,n])=>choice(ic,n,'food')).join('')}</div>
        <button class="btn" onclick="requireChoice('food')">BORA! 🩷</button>
      </div>`;
    }

    if(state.step===4){
      screen.innerHTML=`<div class="card">
        <h1>O QUE VOCÊ PREFERE? ✨</h1>
        <p class="sub">escolhe uma dessas 👇</p>
        <div class="grid">${vibes.map(([ic,n])=>choice(ic,n,'vibe')).join('')}</div>
        <button class="btn" onclick="finish()">ISSO PARECE LEGAL 😎</button>
      </div>`;
    }

    if(state.step===5){
      screen.innerHTML=`<div class="card">
        <div class="emoji">😌💙</div>
        <h1>ENTÃO FECHOU?</h1>
        <p class="sub">só conferindo porque agora eu vou levar isso a sério kkkkk</p>
        <div class="summary">
          <div class="row"><span>📅 Dia</span><strong>${formatDate(state.date)}</strong></div>
          <div class="row"><span>🕒 Horário</span><strong>${state.time}</strong></div>
          <div class="row"><span>🍴 Comida</span><strong>${state.food}</strong></div>
          <div class="row"><span>✨ Vibe</span><strong>${state.vibe}</strong></div>
        </div>
        <button class="btn" onclick="confirmDate()">CONCORDO ❤️</button>
        <button class="btn secondary" onclick="editChoices()" style="margin-top:9px">quero mudar alguma coisa</button>
      </div>`;
    }

    if(state.step===6){
      screen.innerHTML=`<div class="card final-card">
        <div class="celebration-badge">🍥 MISSÃO CUMPRIDA</div>
        <iframe class="celebration-gif" src="${CONFIG.celebrationEmbed}" title="Naruto apaixonado comemorando" loading="eager" allowfullscreen></iframe>
        <h1>EU SABIAAAA 😭🔥</h1>
        <p class="sub">ok... agora o date tá oficialmente confirmado kkkkk</p>
        <button class="btn" onclick="openMusic()">TEM MAIS UMA COISA 🎧</button>
      </div>`;
    }

    // Em telas pequenas, cada nova etapa começa visível do topo.
    if(window.innerWidth <= 480){
      requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'smooth'}));
    }
  }

  function yes(){state.step=1;render();}
  function next(){state.step++;render();}
  function choice(ic,name,key){return `<button class="choice ${state[key]===name?'selected':''}" onclick="selectChoice('${key}','${name.replaceAll("'","\\'")}')"><span class="ic">${ic}</span><span>${name}</span></button>`}
  function selectChoice(key,name){state[key]=name;render();}
  function requireChoice(key){if(!state[key])return toast('Escolhe uma opção primeiro 😅');next();}
  function saveDate(){const d=document.getElementById('date').value,t=document.getElementById('time').value;if(!d||!t)return toast('Escolhe a data e o horário primeiro 👀');state.date=d;state.time=t;next();}
  function finish(){if(!state.vibe)return toast('Escolhe uma vibe primeiro ✨');state.step=5;render();}
  function editChoices(){state.step=2;render();}

  async function confirmDate(){
    const payload={nome:CONFIG.nomeDela,resposta:'SIM',data:formatDate(state.date),horario:state.time,comida:state.food,vibe:state.vibe};

    // Envia a resposta automaticamente para um tópico privado por nome aleatório.
    // Não expõe seu e-mail no código.
    const notification =
      '💙🩷 Melissa confirmou o date!\n\n' +
      '📅 Data: ' + payload.data + '\n' +
      '🕒 Horário: ' + payload.horario + '\n' +
      '🍴 Comida: ' + payload.comida + '\n' +
      '✨ Vibe: ' + payload.vibe;

    try{
      await fetch('https://ntfy.sh/' + CONFIG.ntfyTopic, {
        method:'POST',
        body:notification
      });
    }catch(e){
      console.warn('Não foi possível enviar a notificação.', e);
    }

    if(CONFIG.formspree){
      try{await fetch(CONFIG.formspree,{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});}catch(e){}
    }

    state.step=6;render();burst();
  }

  function openMusic(){ if(CONFIG.youtubeUrl) window.location.href=CONFIG.youtubeUrl; }

  function formatDate(v){if(!v)return'';const[y,m,d]=v.split('-');return`${d}/${m}/${y}`}
  function setMinDate(){const el=document.getElementById('date');if(!el)return;const now=new Date();now.setMinutes(now.getMinutes()-now.getTimezoneOffset());el.min=now.toISOString().split('T')[0]}
  function toast(text){const t=document.getElementById('toast');t.textContent=text;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),2200)}

  function overlaps(a,b,gap=0){return!(a.right+gap<=b.left||a.left-gap>=b.right||a.bottom+gap<=b.top||a.top-gap>=b.bottom)}
  function cardForbiddenRect(gap=18){const card=document.querySelector('.card');if(!card)return null;const r=card.getBoundingClientRect();return{left:r.left-gap,top:r.top-gap,right:r.right+gap,bottom:r.bottom+gap}}
  function visibleViewport(){
    const vv=window.visualViewport;
    return {
      width:vv?.width||window.innerWidth,
      height:vv?.height||window.innerHeight,
      left:vv?.offsetLeft||0,
      top:vv?.offsetTop||0
    };
  }
  function validNoPosition(x,y,w,h,forbidden){
    const margin=14,v=visibleViewport();
    if(x<v.left+margin||y<v.top+margin||x+w>v.left+v.width-margin||y+h>v.top+v.height-margin)return false;
    const c={left:x,top:y,right:x+w,bottom:y+h};return!forbidden||!overlaps(c,forbidden)
  }
  function randomOutsideCard(btn,animate=true){
    if(!btn)return;
    const rect=btn.getBoundingClientRect(),w=rect.width||112,h=rect.height||48,forbidden=cardForbiddenRect(18),margin=14,v=visibleViewport(),
      minX=v.left+margin,minY=v.top+margin,maxX=Math.max(minX,v.left+v.width-w-margin),maxY=Math.max(minY,v.top+v.height-h-margin),
      cx=parseFloat(btn.style.left),cy=parseFloat(btn.style.top);let best=null;
    for(let i=0;i<180;i++){const x=minX+Math.random()*Math.max(1,maxX-minX),y=minY+Math.random()*Math.max(1,maxY-minY);if(!validNoPosition(x,y,w,h,forbidden))continue;const dist=(Number.isFinite(cx)&&Number.isFinite(cy))?Math.hypot(x-cx,y-cy):9999;if(dist>120){best={x,y};break}if(!best||dist>best.dist)best={x,y,dist}}
    if(!best)best={x:minX,y:minY};if(!animate)btn.style.transition='none';btn.style.left=`${Math.round(best.x)}px`;btn.style.top=`${Math.round(best.y)}px`;btn.style.transform=`rotate(${(Math.random()*8-4).toFixed(1)}deg)`;if(!animate)requestAnimationFrame(()=>requestAnimationFrame(()=>btn.style.transition=''));
  }
  function runAway(event){
    event.preventDefault();event.stopPropagation();const btn=document.getElementById('noBtn');if(!btn)return;state.noAttempts++;
    if(!btn.classList.contains('runaway')){const r=btn.getBoundingClientRect();document.body.appendChild(btn);btn.classList.add('runaway');btn.style.left=`${Math.round(r.left)}px`;btn.style.top=`${Math.round(r.top)}px`;btn.style.width=`${Math.round(r.width)}px`;btn.style.transform='rotate(0deg)';void btn.offsetWidth}
    randomOutsideCard(btn,true);
  }
  function keepNoVisible(){const btn=document.getElementById('noBtn');if(btn&&btn.classList.contains('runaway'))randomOutsideCard(btn,false)}
  window.addEventListener('resize',keepNoVisible);
  if(window.visualViewport) window.visualViewport.addEventListener('resize',keepNoVisible);

  function hearts(){const field=document.getElementById('heartField');for(let i=0;i<27;i++){const h=document.createElement('i');h.className='heart';h.style.left=(Math.random()*100)+'%';h.style.top=(Math.random()*130-5)+'%';h.style.setProperty('--s',(10+Math.random()*18)+'px');h.style.setProperty('--d',(7+Math.random()*8)+'s');h.style.setProperty('--delay',(-Math.random()*14)+'s');h.style.setProperty('--drift',(-45+Math.random()*90)+'px');field.appendChild(h)}}
  function burst(){const field=document.getElementById('heartField');for(let i=0;i<18;i++){const h=document.createElement('i');h.className='heart';h.style.left=(42+Math.random()*16)+'%';h.style.top=(55+Math.random()*8)+'%';h.style.setProperty('--s',(12+Math.random()*18)+'px');h.style.setProperty('--d',(3+Math.random()*3)+'s');h.style.setProperty('--delay','0s');h.style.setProperty('--drift',(-140+Math.random()*280)+'px');field.appendChild(h);setTimeout(()=>h.remove(),6500)}}

  hearts();render();
</script>
</body>
</html>
